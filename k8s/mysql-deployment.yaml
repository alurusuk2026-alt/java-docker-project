apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql

spec:
  replicas: 1

  selector:
    matchLabels:
      io.kompose.service: mysql

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        io.kompose.service: mysql

    spec:
      containers:
        - name: employee-mysql
          image: mysql:8.4

          ports:
            - containerPort: 3306
              protocol: TCP

          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: employee-db-secret
                  key: DB_NAME

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: employee-db-secret
                  key: DB_USERNAME

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-db-secret
                  key: DB_PASSWORD

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employee-db-secret
                  key: MYSQL_ROOT_PASSWORD

          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            failureThreshold: 10
            periodSeconds: 10
            timeoutSeconds: 5

          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-data

      restartPolicy: Always

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data