trigger:
  branches:
    include:
      - main

pr: none

variables:
  imageRepository: employee-api
  containerRegistry: sukanyajavadevopsacr2026.azurecr.io
  dockerfilePath: $(Build.SourcesDirectory)/Dockerfile
  tag: $(Build.BuildId)

stages:

# ============================================================
# STAGE 1 - BUILD AND TEST
# ============================================================

- stage: Build_Test
  displayName: "Build and Test"

  jobs:
  - job: Maven_Test
    displayName: "Run Maven Unit Tests"

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: Maven@4
      displayName: "Run Unit Tests"
      inputs:
        mavenPomFile: "pom.xml"
        goals: "clean test"
        javaHomeOption: "JDKVersion"
        jdkVersionOption: "1.17"
        mavenVersionOption: "Default"
        publishJUnitResults: true
        testResultsFiles: "**/surefire-reports/TEST-*.xml"


# ============================================================
# STAGE 2 - DOCKER BUILD AND PUSH TO ACR
# ============================================================

- stage: Docker
  displayName: "Build and Push Docker Image"

  dependsOn: Build_Test
  condition: succeeded()

  jobs:
  - job: Docker_Build_Push
    displayName: "Build and Push Employee API Image"

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: Docker@2
      displayName: "Build and Push Docker Image to ACR"
      inputs:
        containerRegistry: "ACR-Docker-Service-Connection-1"
        repository: "$(imageRepository)"
        command: "buildAndPush"
        Dockerfile: "$(dockerfilePath)"
        buildContext: "$(Build.SourcesDirectory)"
        tags: |
          $(tag)


# ============================================================
# STAGE 3 - DEPLOY TO AKS
# ============================================================

- stage: Deploy
  displayName: "Deploy to AKS"

  dependsOn: Docker
  condition: succeeded()

  jobs:
  - job: Deploy_AKS
    displayName: "Deploy Employee API to AKS"

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self

    - task: KubernetesManifest@1
      displayName: "Deploy Employee API to AKS"
      inputs:
        action: deploy
        connectionType: azureResourceManager
        azureSubscriptionConnection: "AZURE-AKS-SERVICE-CONNECTION"
        azureResourceGroup: "rg-java-devops-project"
        kubernetesCluster: "aks-java-devops"
        namespace: default
        manifests: |
          employee-api-deployment.yaml
          employee-api-service.yaml
        containers: |
          sukanyajavadevopsacr2026.azurecr.io/employee-api:$(tag)