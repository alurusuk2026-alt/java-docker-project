trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: employee-api
  containerRegistry: sukanyajavadevopsacr2026.azurecr.io
  dockerfilePath: $(Build.SourcesDirectory)/Dockerfile
  tag: $(Build.BuildId)

steps:

# ==========================================================
# 1. RUN UNIT TESTS
# ==========================================================

- task: Maven@4
  displayName: "Run Unit Tests"
  inputs:
    mavenPomFile: "pom.xml"
    goals: "test"
    javaHomeOption: "JDKVersion"
    jdkVersionOption: "1.17"
    mavenVersionOption: "Default"


# ==========================================================
# 2. BUILD + PUSH DOCKER IMAGE TO ACR
# ==========================================================

- task: Docker@2
  displayName: "Build and Push Docker Image to ACR"
  inputs:
    containerRegistry: "ACR-Docker-Service-Connection"
    repository: "$(imageRepository)"
    command: "buildAndPush"
    Dockerfile: "$(dockerfilePath)"
    buildContext: "$(Build.SourcesDirectory)"
    tags: |
      $(tag)


# ==========================================================
# 3. DEPLOY TO AKS
# ==========================================================

- task: KubernetesManifest@1
  displayName: "Deploy Employee API to AKS"
  inputs:
    action: deploy
    connectionType: azureResourceManager
    azureSubscriptionConnection: "AZURE-AKS-SERVICE-CONNECTION"
    azureResourceGroup: "rg-java-devops-project"
    kubernetesCluster: "aks-java-devops"
    namespace: default

    manifests: |
      $(Build.SourcesDirectory)/employee-api-deployment.yaml
      $(Build.SourcesDirectory)/employee-api-service.yaml

    containers: |
      sukanyajavadevopsacr2026.azurecr.io/employee-api:$(Build.BuildId)