trigger:
  branches:
    include:
      - main

pr: none


# ==========================================================
# GLOBAL VARIABLES
# ==========================================================

variables:
  imageRepository: employee-api
  containerRegistry: sukanyajavadevopsacr2026.azurecr.io

  dockerfilePath: $(Build.SourcesDirectory)/Dockerfile

  # Build ID becomes Docker image tag
  tag: $(Build.BuildId)

  # Azure DevOps service connections
  azureServiceConnection: AZURE-AKS-SERVICE-CONNECTION
  acrServiceConnection: ACR-Docker-Service-Connection-1

  # Azure resources
  resourceGroup: rg-java-devops-project
  aksCluster: aks-java-devops
  namespace: default


# ==========================================================
# STAGES
# ==========================================================

stages:


# ==========================================================
# STAGE 1 - CI
# Maven Test -> Docker Build -> Push to ACR
# ==========================================================

- stage: CI
  displayName: "CI - Build Test and Push"

  jobs:

  - job: Build
    displayName: "Build Test and Push Docker Image"

    pool:
      vmImage: ubuntu-latest

    steps:

    # ------------------------------------------------------
    # CHECKOUT SOURCE CODE
    # ------------------------------------------------------

    - checkout: self
      displayName: "Checkout Source Code"


    # ------------------------------------------------------
    # MAVEN UNIT TEST
    # ------------------------------------------------------

    - task: Maven@4
      displayName: "Run Maven Unit Tests"
      inputs:
        mavenPomFile: "pom.xml"
        goals: "test"
        javaHomeOption: "JDKVersion"
        jdkVersionOption: "1.17"
        mavenVersionOption: "Default"


    # ------------------------------------------------------
    # DOCKER BUILD AND PUSH
    # ------------------------------------------------------

    - task: Docker@2
      displayName: "Build and Push Employee API Image"
      inputs:
        containerRegistry: "$(acrServiceConnection)"
        repository: "$(imageRepository)"
        command: "buildAndPush"
        Dockerfile: "$(dockerfilePath)"
        buildContext: "$(Build.SourcesDirectory)"
        tags: |
          $(tag)


    # ------------------------------------------------------
    # DISPLAY IMAGE INFORMATION
    # ------------------------------------------------------

    - bash: |

        echo "=========================================="
        echo "Docker Image Successfully Built"
        echo "=========================================="

        echo "Registry:"
        echo "$(containerRegistry)"

        echo "Repository:"
        echo "$(imageRepository)"

        echo "Tag:"
        echo "$(tag)"

        echo "Full Image:"
        echo "$(containerRegistry)/$(imageRepository):$(tag)"

      displayName: "Display Docker Image"


# ==========================================================
# STAGE 2 - DEV
# Deploy MySQL + Employee API
# ==========================================================

- stage: Deploy_Dev
  displayName: "Deploy to DEV"

  dependsOn: CI

  condition: succeeded()

  jobs:

  - deployment: DeployDev
    displayName: "Deploy Employee API to DEV"

    pool:
      vmImage: ubuntu-latest

    environment: "employee-dev"

    strategy:

      runOnce:

        deploy:

          steps:

          # ------------------------------------------------
          # CHECKOUT SOURCE CODE
          # ------------------------------------------------

          - checkout: self
            displayName: "Checkout Source Code"


          # ------------------------------------------------
          # DEPLOY MYSQL PVC
          # ------------------------------------------------

          - task: KubernetesManifest@1
            displayName: "Deploy MySQL PVC"
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              manifests: |
                $(Build.SourcesDirectory)/k8s/mysql-data-persistentvolumeclaim.yaml


          # ------------------------------------------------
          # DEPLOY MYSQL
          # ------------------------------------------------

          - task: KubernetesManifest@1
            displayName: "Deploy MySQL"
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              manifests: |
                $(Build.SourcesDirectory)/k8s/mysql-deployment.yaml
                $(Build.SourcesDirectory)/k8s/mysql-service.yaml


          # ------------------------------------------------
          # WAIT FOR MYSQL
          # ------------------------------------------------

          - task: Kubernetes@1
            displayName: "Wait for MySQL"
            inputs:
              connectionType: "Azure Resource Manager"
              azureSubscriptionEndpoint: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              command: "rollout"
              arguments: "status deployment/mysql --timeout=180s"


          # ------------------------------------------------
          # DEPLOY EMPLOYEE API
          # ------------------------------------------------

          - task: KubernetesManifest@1
            displayName: "Deploy Employee API"
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              manifests: |
                $(Build.SourcesDirectory)/k8s/employee-api-deployment.yaml
                $(Build.SourcesDirectory)/k8s/employee-api-service.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)


          # ------------------------------------------------
          # VERIFY EMPLOYEE API
          # ------------------------------------------------

          - task: Kubernetes@1
            displayName: "Verify DEV Employee API Rollout"
            inputs:
              connectionType: "Azure Resource Manager"
              azureSubscriptionEndpoint: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              command: "rollout"
              arguments: "status deployment/employee-api --timeout=180s"


# ==========================================================
# STAGE 3 - STAGING
# Deploy Employee API
# ==========================================================

- stage: Deploy_Staging
  displayName: "Deploy to STAGING"

  dependsOn: Deploy_Dev

  condition: succeeded()

  jobs:

  - deployment: DeployStaging
    displayName: "Deploy Employee API to STAGING"

    pool:
      vmImage: ubuntu-latest

    environment: "employee-staging"

    strategy:

      runOnce:

        deploy:

          steps:

          # ------------------------------------------------
          # CHECKOUT SOURCE CODE
          # ------------------------------------------------

          - checkout: self
            displayName: "Checkout Source Code"


          # ------------------------------------------------
          # DEPLOY EMPLOYEE API
          # ------------------------------------------------

          - task: KubernetesManifest@1
            displayName: "Deploy Employee API to STAGING"
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              manifests: |
                $(Build.SourcesDirectory)/k8s/employee-api-deployment.yaml
                $(Build.SourcesDirectory)/k8s/employee-api-service.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)


          # ------------------------------------------------
          # VERIFY ROLLOUT
          # ------------------------------------------------

          - task: Kubernetes@1
            displayName: "Verify STAGING Employee API Rollout"
            inputs:
              connectionType: "Azure Resource Manager"
              azureSubscriptionEndpoint: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              command: "rollout"
              arguments: "status deployment/employee-api --timeout=180s"


# ==========================================================
# STAGE 4 - PRODUCTION
#
# Production:
# 1. Connect to AKS
# 2. Deploy MySQL PVC
# 3. Deploy MySQL
# 4. Wait for MySQL
# 5. Find MySQL Pod
# 6. Insert employee SQL
# 7. Verify employee table
# 8. Deploy Employee API
# 9. Verify rollout
# 10. Verify pods and services
# ==========================================================

- stage: Deploy_Production
  displayName: "PRODUCTION DEPLOYMENT"

  dependsOn: Deploy_Staging

  condition: succeeded()

  jobs:

  - deployment: DeployProduction
    displayName: "Deploy Employee API to PRODUCTION"

    pool:
      vmImage: ubuntu-latest

    # ------------------------------------------------------
    # IMPORTANT
    #
    # Configure approval/checks on this environment:
    #
    # employee-production
    # ------------------------------------------------------

    environment: "employee-production"

    strategy:

      runOnce:

        deploy:

          steps:

          # ------------------------------------------------
          # CHECKOUT SOURCE CODE
          # ------------------------------------------------

          - checkout: self
            displayName: "Checkout Source Code"


          # =================================================
          # 1. CONNECT TO AKS
          # =================================================

          - task: AzureCLI@2
            displayName: "Connect to Production AKS"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"

              inlineScript: |

                set -e

                echo "=========================================="
                echo "Connecting to AKS"
                echo "=========================================="

                az aks get-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(aksCluster)" \
                  --overwrite-existing

                echo "AKS connection successful."

                echo "=========================================="
                echo "AKS Nodes"
                echo "=========================================="

                kubectl get nodes


          # =================================================
          # 2. DEPLOY MYSQL PVC
          # =================================================

          - task: KubernetesManifest@1
            displayName: "Deploy Production MySQL PVC"
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              manifests: |
                $(Build.SourcesDirectory)/k8s/mysql-data-persistentvolumeclaim.yaml


          # =================================================
          # 3. DEPLOY MYSQL
          # =================================================

          - task: KubernetesManifest@1
            displayName: "Deploy Production MySQL"
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              manifests: |
                $(Build.SourcesDirectory)/k8s/mysql-deployment.yaml
                $(Build.SourcesDirectory)/k8s/mysql-service.yaml


          # =================================================
          # 4. WAIT FOR MYSQL
          # =================================================

          - task: Kubernetes@1
            displayName: "Wait for Production MySQL"
            inputs:
              connectionType: "Azure Resource Manager"
              azureSubscriptionEndpoint: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              command: "rollout"
              arguments: "status deployment/mysql --timeout=180s"


          # =================================================
          # 5. GET MYSQL POD
          # =================================================

          - bash: |

              set -e

              echo "=========================================="
              echo "Getting MySQL Pod"
              echo "=========================================="

              MYSQL_POD=$(kubectl get pods \
                -l io.kompose.service=mysql \
                -o jsonpath='{.items[0].metadata.name}')

              if [ -z "$MYSQL_POD" ]; then
                echo "ERROR: MySQL pod not found."
                exit 1
              fi

              echo "MySQL Pod:"
              echo "$MYSQL_POD"

              echo "##vso[task.setvariable variable=MYSQL_POD]$MYSQL_POD"

            displayName: "Get MySQL Pod"


          # =================================================
          # 6. INSERT EMPLOYEE DATA
          # =================================================

          - bash: |

              set -e

              echo "=========================================="
              echo "Employee Database Change"
              echo "=========================================="


              # ------------------------------------------------
              # GET DATABASE USERNAME
              # ------------------------------------------------

              DB_USERNAME=$(kubectl get secret employee-db-secret \
                -o jsonpath='{.data.DB_USERNAME}' | base64 --decode)


              # ------------------------------------------------
              # GET DATABASE PASSWORD
              # ------------------------------------------------

              DB_PASSWORD=$(kubectl get secret employee-db-secret \
                -o jsonpath='{.data.DB_PASSWORD}' | base64 --decode)


              # ------------------------------------------------
              # GET DATABASE NAME
              # ------------------------------------------------

              DB_NAME=$(kubectl get secret employee-db-secret \
                -o jsonpath='{.data.DB_NAME}' | base64 --decode)


              echo "Database:"
              echo "$DB_NAME"


              # ------------------------------------------------
              # CHECK SQL FILE
              # ------------------------------------------------

              echo "Checking SQL file..."

              if [ ! -f "$(Build.SourcesDirectory)/insert_employee.sql" ]; then

                echo "ERROR: insert_employee.sql not found."

                exit 1

              fi

              echo "SQL file found."


              # ------------------------------------------------
              # COPY SQL FILE TO MYSQL POD
              # ------------------------------------------------

              echo "Copying SQL file to MySQL pod..."

              kubectl cp \
                "$(Build.SourcesDirectory)/insert_employee.sql" \
                "$(MYSQL_POD):/tmp/insert_employee.sql"


              # ------------------------------------------------
              # EXECUTE SQL
              # ------------------------------------------------

              echo "Executing SQL..."

              kubectl exec "$(MYSQL_POD)" -- \
                env \
                DB_USERNAME="$DB_USERNAME" \
                DB_PASSWORD="$DB_PASSWORD" \
                DB_NAME="$DB_NAME" \
                sh -c \
                'mysql -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_NAME" < /tmp/insert_employee.sql'


              echo "=========================================="
              echo "Database Change Completed"
              echo "=========================================="


              # ------------------------------------------------
              # VERIFY EMPLOYEE TABLE
              # ------------------------------------------------

              echo "Verifying employee table..."

              kubectl exec "$(MYSQL_POD)" -- \
                env \
                DB_USERNAME="$DB_USERNAME" \
                DB_PASSWORD="$DB_PASSWORD" \
                DB_NAME="$DB_NAME" \
                sh -c \
                'mysql -u"$DB_USERNAME" -p"$DB_PASSWORD" "$DB_NAME" -e "SELECT * FROM employee;"'


            displayName: "Insert Employee Data"


          # =================================================
          # 7. DEPLOY EMPLOYEE API
          # =================================================

          - task: KubernetesManifest@1
            displayName: "Deploy Employee API to PRODUCTION"
            inputs:
              action: deploy
              connectionType: azureResourceManager
              azureSubscriptionConnection: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              manifests: |
                $(Build.SourcesDirectory)/k8s/employee-api-deployment.yaml
                $(Build.SourcesDirectory)/k8s/employee-api-service.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)


          # =================================================
          # 8. VERIFY PRODUCTION ROLLOUT
          # =================================================

          - task: Kubernetes@1
            displayName: "Verify Production Deployment"
            inputs:
              connectionType: "Azure Resource Manager"
              azureSubscriptionEndpoint: "$(azureServiceConnection)"
              azureResourceGroup: "$(resourceGroup)"
              kubernetesCluster: "$(aksCluster)"
              namespace: "$(namespace)"
              command: "rollout"
              arguments: "status deployment/employee-api --timeout=180s"


          # =================================================
          # 9. VERIFY PODS AND SERVICES
          # =================================================

          - bash: |

              set -e

              echo "=========================================="
              echo "Production Pods"
              echo "=========================================="

              kubectl get pods -o wide


              echo "=========================================="
              echo "Production Services"
              echo "=========================================="

              kubectl get services


              echo "=========================================="
              echo "Employee API Deployment"
              echo "=========================================="

              kubectl get deployment employee-api


              echo "=========================================="
              echo "MySQL Deployment"
              echo "=========================================="

              kubectl get deployment mysql

            displayName: "Verify Production AKS"